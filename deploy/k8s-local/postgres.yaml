apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: warden-local
type: Opaque
stringData:
  POSTGRES_USER: warden
  POSTGRES_PASSWORD: warden
  POSTGRES_DB: warden
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: warden-local
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: warden-local
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - secretRef: { name: postgres-credentials }
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata # avoid postgres complaining about a non-empty mount root
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "warden"] }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-data }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: warden-local
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
