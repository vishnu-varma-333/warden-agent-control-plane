server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

# Local dev / single-VM demo scale: traces kept for 1 hour, not Tempo's own
# much longer default — there's no object-storage backend here (that's a
# real production concern, S3/GCS-backed, deliberately out of scope for a
# single-VM demo), so this just bounds local disk growth.
compactor:
  compaction:
    block_retention: 1h
