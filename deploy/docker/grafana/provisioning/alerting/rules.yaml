apiVersion: 1

groups:
  - orgId: 1
    name: warden-alerts
    folder: Warden
    interval: 1m
    rules:
      - uid: warden-error-rate
        title: High error rate
        condition: C
        for: 5m
        annotations:
          summary: "5xx error rate over 5% for 5 minutes"
        labels:
          severity: critical
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              editorMode: code
              expr: |
                sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m]))
                /
                sum(rate(http_server_request_duration_seconds_count[5m]))
              instant: true
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.05] }
              refId: C

      - uid: warden-latency-slo
        title: Added latency SLO burn
        condition: C
        for: 5m
        annotations:
          summary: "p99 added latency over the 15ms target for 5 minutes"
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              editorMode: code
              expr: |
                histogram_quantile(0.99, sum(rate(http_server_request_duration_seconds_bucket[5m])) by (le))
              instant: true
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.015] } # 15ms, matching the spec's benchmark target
              refId: C

      - uid: warden-audit-tampered
        title: Audit chain verification failed
        condition: C
        for: 0s # fire immediately — a tampered chain is not a "wait and see" condition
        annotations:
          summary: "The most recent audit chain verification (console-triggered or periodic) found tampering"
        labels:
          severity: critical
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              editorMode: code
              expr: min(warden_audit_last_verify_ok)
              instant: true
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C
